name: Export Google Scholar citation data
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r google_scholar_crawler/requirements.txt
      - run: python main.py
        working-directory: google_scholar_crawler
        env:
          GOOGLE_SCHOLAR_ID: sMZ0X6sAAAAJ
      - name: Downloadable citation data
        uses: actions/upload-artifact@v4
        with:
          name: google-scholar-citation-data
          path: google_scholar_crawler/results/*.json
